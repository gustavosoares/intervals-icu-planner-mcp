[build-system]
requires = ["hatchling>=1.24", "hatch-vcs>=0.4", "hatch-fancy-pypi-readme>=24.1"]
build-backend = "hatchling.build"

[project]
name = "intervals-icu-planner-mcp"
description = "MCP server and CLI to push, inspect and remove whole training plans on intervals.icu, safely"
dynamic = ["version", "readme"]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "ruamel.yaml>=0.18",
    "keyring>=24",
]
keywords = ["intervals.icu", "mcp", "zwo", "zwift", "cycling", "training-plan"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

[project.scripts]
intervals-icu-planner-mcp = "intervals_icu_planner_mcp.server:main"
intervals-icu-planner = "intervals_icu_planner_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/gustavosoares/intervals-icu-planner-mcp"
Issues = "https://github.com/gustavosoares/intervals-icu-planner-mcp/issues"
Changelog = "https://github.com/gustavosoares/intervals-icu-planner-mcp/blob/main/CHANGELOG.md"

# The version comes from the git tag (v0.2.0 -> 0.2.0). The publish workflow
# sets it explicitly; untagged dev builds get 0.2.1.devN+g<hash>.
[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
fallback_version = "0.0.0"  # e.g. a shallow clone with no tags

# PyPI can't resolve the README's relative links and images: point them at GitHub.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '!\[([^\]]*)\]\((?!https?://)([^)]+)\)'
replacement = '![\1](https://raw.githubusercontent.com/gustavosoares/intervals-icu-planner-mcp/main/\2)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = 'src="(?!https?://)([^"]+)"'
replacement = 'src="https://raw.githubusercontent.com/gustavosoares/intervals-icu-planner-mcp/main/\1"'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#)([^)]+)\)'
replacement = '](https://github.com/gustavosoares/intervals-icu-planner-mcp/blob/main/\1)'

[tool.hatch.build.targets.wheel]
packages = ["src/intervals_icu_planner_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
warn_return_any = false
