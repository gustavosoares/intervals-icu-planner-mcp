name: publish

# Manual only: Actions → publish → Run workflow, or
#   gh workflow run publish.yml --ref main -f version=0.2.0 -f target=testpypi
#
# The version is an input, not a file in the repo: the package is built with
# that version, and after a PyPI upload the commit is tagged v<version>, which
# is where hatch-vcs reads it from afterwards. For PyPI, CHANGELOG.md on main
# must already have a "## [<version>]" section; it becomes the release notes.
#
# Who can publish is enforced in three places:
#   1. workflow_dispatch needs write access to the repo;
#   2. the jobs below only run for the repository owner, on main;
#   3. the upload job uses the `pypi` (or `testpypi`) environment, which is
#      configured with the owner as required reviewer and limited to `main`.
# The upload uses PyPI trusted publishing (OIDC): there is no API token secret.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. 0.2.0 (no leading v)
        type: string
        required: true
      target:
        description: Where to upload
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    if: github.actor == github.repository_owner && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      TARGET: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, for the version checks
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" build twine packaging
      - name: Check the version
        run: |
          python - <<'EOF'
          import os, re, subprocess, sys
          from packaging.version import InvalidVersion, Version

          raw, target = os.environ["VERSION"], os.environ["TARGET"]
          def fail(msg):
              print(f"::error::{msg}")
              sys.exit(1)

          try:
              v = Version(raw)
          except InvalidVersion:
              fail(f"{raw!r} isn't a valid version (e.g. 0.2.0)")
          if str(v) != raw or v.local or v.is_devrelease:
              fail(f"use a plain release version like 0.2.0 or 0.2.0rc1, not {raw!r}")

          tags = subprocess.run(["git", "tag", "--list", "v*"], capture_output=True,
                                text=True, check=True).stdout.split()
          released = []
          for t in tags:
              try:
                  released.append(Version(t[1:]))
              except InvalidVersion:
                  pass
          if v in released:
              fail(f"v{v} is already released")
          if released and v <= max(released):
              fail(f"{v} must be newer than the latest release, v{max(released)}")

          if target == "pypi":
              changelog = open("CHANGELOG.md", encoding="utf-8").read()
              if not re.search(rf"^## \[{re.escape(raw)}\]", changelog, re.M):
                  fail(f"CHANGELOG.md has no '## [{raw}]' section: move the Unreleased "
                       "entries under it (and merge that to main) first")
          print(f"releasing {v} to {target}")
          EOF
      - run: ruff check . && ruff format --check .
      - run: mypy
      - run: pytest -q
      - name: Build
        run: python -m build
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ inputs.version }}
      - run: twine check --strict dist/*
      - name: The built files carry the version
        run: |
          ls dist/
          test -f "dist/intervals_icu_planner_mcp-${VERSION}-py3-none-any.whl"
          test -f "dist/intervals_icu_planner_mcp-${VERSION}.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  upload:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.target }}
      url: ${{ inputs.target == 'pypi' && 'https://pypi.org/p/intervals-icu-planner-mcp' || 'https://test.pypi.org/p/intervals-icu-planner-mcp' }}
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ inputs.target == 'pypi' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}

  release:
    # Tag the version and create a GitHub release, only after a real PyPI upload.
    if: inputs.target == 'pypi'
    needs: upload
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v h="## [${VERSION}]" '
            index($0, h) == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[[^]]+\]: / { next }
            on { print }
          ' CHANGELOG.md > notes.md
          cat notes.md
      - run: |
          flags=()
          case "$VERSION" in *a*|*b*|*rc*) flags+=(--prerelease) ;; esac
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" \
            --notes-file notes.md "${flags[@]}"
