name: publish

# Manual only: Actions → publish → Run workflow.
# Who can publish is enforced in three places:
#   1. workflow_dispatch needs write access to the repo;
#   2. the jobs below only run for the repository owner;
#   3. the upload job uses the `pypi` (or `testpypi`) environment, which is
#      configured with the owner as required reviewer and limited to `main`.
# The upload uses PyPI trusted publishing (OIDC): there is no API token secret.

on:
  workflow_dispatch:
    inputs:
      target:
        description: Where to upload
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    if: github.actor == github.repository_owner && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" build twine
      - run: ruff check . && ruff format --check .
      - run: mypy
      - run: pytest -q
      - run: python -m build
      - run: twine check --strict dist/*
      - id: version
        run: echo "version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')" >> "$GITHUB_OUTPUT"
      - name: Version must not have a tag yet
        if: inputs.target == 'pypi'
        run: |
          git fetch --tags --quiet
          if git rev-parse -q --verify "refs/tags/v${{ steps.version.outputs.version }}" >/dev/null; then
            echo "::error::v${{ steps.version.outputs.version }} is already tagged: bump the version in pyproject.toml"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  upload:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.target }}
      url: ${{ inputs.target == 'pypi' && 'https://pypi.org/p/intervals-icu-planner-mcp' || 'https://test.pypi.org/p/intervals-icu-planner-mcp' }}
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ inputs.target == 'pypi' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}

  release:
    # Tag the version and create a GitHub release, only after a real PyPI upload.
    if: inputs.target == 'pypi'
    needs: [build, upload]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
