name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test]"
      - run: pytest -q
      - run: python push.py examples/winter-base-12wk/plan.yaml --dry-run

  # Single, stable check name for branch protection (matrix jobs report one
  # check per Python version).
  checks:
    name: ci-checks
    needs: [pytest]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          r="${{ needs.pytest.result }}"
          [[ "$r" == success || "$r" == skipped ]] || { echo "pytest: $r"; exit 1; }
