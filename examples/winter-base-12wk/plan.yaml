# 12-week winter base plan: threshold progression, tempo blocks, a weekly
# outdoor ride, and a recovery week every 4th week.
# All power targets in the .zwo files are % of FTP, so set your FTP in the
# app you ride with (Zwift, MyWhoosh, Garmin, ...).

name: Winter Base 12wk
id: winterbase            # uid prefix: winterbase-w01-tue, winterbase-w01-wed, ...
start: 2026-11-30         # Monday of week 1 (override with --start)
weeks: 12
workouts_dir: workouts    # relative to this file
type: Ride

# The default week. Tuesday's key session changes every week (see overrides).
template:
  tue: T1_Threshold_3x8.zwo
  wed: W02_Z2_Endurance_60_Cadence.zwo
  thu: W04_Z2_60_Neuromuscular_Sprints.zwo
  sat:
    note: Outdoor group ride
    description: >-
      Long outdoor ride, mostly Z2. Bad weather? Ride W08_Rainy_Saturday_2h
      indoors instead.
  sun: W01_Recovery_Spin_45.zwo

# Every 4th week: drop the intensity, keep some easy volume.
recovery:
  weeks: [4, 8, 12]
  template:
    tue: W02_Z2_Endurance_60_Cadence.zwo
    thu: W01_Recovery_Spin_45.zwo
    sat:
      note: Recovery week - easy ride or skip
      description: Keep it conversational. Skipping is fine.

# Per-week changes, merged over that week's template. Use `day: null` to
# remove a session.
overrides:
  1:  { tue: T1_Threshold_3x8.zwo }
  2:  { tue: W06_Tempo_3x10.zwo, thu: W05_Low_Cadence_Force_5x5.zwo }
  3:  { tue: T2_Threshold_3x10.zwo }
  5:  { tue: T3_Threshold_2x15.zwo }
  6:  { tue: W07_Tempo_2x20.zwo, thu: W05_Low_Cadence_Force_5x5.zwo }
  7:  { tue: T4_Threshold_3x12.zwo }
  9:  { tue: T5_Threshold_2x20.zwo }
  10: { tue: W07_Tempo_2x20.zwo, thu: W05_Low_Cadence_Force_5x5.zwo }
  11: { tue: T6_Threshold_2x20_Progressed.zwo }
