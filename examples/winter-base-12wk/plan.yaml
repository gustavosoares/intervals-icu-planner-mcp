# yaml-language-server: $schema=../../schemas/plan.schema.json
#
# Winter base plan: 12 weeks of mostly Z1-Z2 and light tempo, with no threshold work.
# Three 4-week cycles: two short weeks (weekday rides of 60 min or less),
# one longer week, then a sweet spot week. Each sweet spot session builds on the last.
# Weekend: an outdoor group ride on Saturday and a recovery spin on Sunday.
# Monday and Friday are left out: rest or strength training, nothing scheduled.
# Power targets live in the .zwo files as % of FTP.

id: winterbase
name: Winter Base 12 Weeks
start: 2026-11-23
workouts_dir: workouts
type: Ride

templates:
  short:
    tue:
      workout: W09_Tempo_60_2x12.zwo
      description: Light tempo, 2x12 min at 80% FTP. Comfortably hard, 5-6/10.
    wed:
      workout: W10_Z2_45.zwo
      description: Easy Z2. Swap for W02_Z2_Endurance_60_Cadence.zwo if you have the time.
    thu:
      workout: W04_Z2_60_Neuromuscular_Sprints.zwo
      description: Z2 with optional 6x10s sprints. Turn ERG off for the sprints.
    sat:
      note: Outdoor group ride
      description: Long ride of the week, mostly Z2 with some tempo. If the weather is bad, ride W08_Rainy_Saturday_2h.zwo indoors.
    sun: W01_Recovery_Spin_45.zwo

  long:
    tue:
      workout: W06_Tempo_3x10.zwo
      description: Light tempo, 3x10 min at 80% FTP.
    wed: W02_Z2_Endurance_60_Cadence.zwo
    thu:
      workout: W11_Z2_75_Sprints.zwo
      description: Longer Z2 with optional 6x10s sprints. Turn ERG off for the sprints.
    sat:
      note: Outdoor group ride
      description: Long ride of the week, mostly Z2 with some tempo. If the weather is bad, ride W08_Rainy_Saturday_2h.zwo indoors.
    sun: W01_Recovery_Spin_45.zwo

  sweetspot:
    tue:
      workout: S1_SweetSpot_2x15.zwo
      description: Sweet spot at 88-90% FTP. Strong but sustainable, 6-7/10.
    wed: W02_Z2_Endurance_60_Cadence.zwo
    thu:
      workout: W09_Tempo_60_2x12.zwo
      description: Light tempo, 2x12 min at 80% FTP.
    sat:
      note: Outdoor group ride
      description: Long ride of the week, mostly Z2 with some tempo. If the weather is bad, ride W08_Rainy_Saturday_2h.zwo indoors.
    sun: W01_Recovery_Spin_45.zwo

weeks:
  - {template: short}                                   # Week 1
  - {template: short}                                   # Week 2
  - {template: long}                                    # Week 3
  - {template: sweetspot}                               # Week 4
  - {template: short}                                   # Week 5
  - {template: short}                                   # Week 6
  - {template: long}                                    # Week 7
  - {template: sweetspot, overrides: {tue: {workout: S2_SweetSpot_2x20.zwo, description: "Sweet spot at 89% FTP, 2x20 min. Strong but sustainable, 6-7/10."}}}  # Week 8
  - {template: short}                                   # Week 9
  - {template: short}                                   # Week 10
  - {template: long}                                    # Week 11
  - {template: sweetspot, overrides: {tue: {workout: S3_SweetSpot_3x15.zwo, description: "Sweet spot at 90% FTP, 3x15 min. Strong but sustainable, 6-7/10."}}}  # Week 12
